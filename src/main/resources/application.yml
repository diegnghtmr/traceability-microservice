server:
  port: 8093
  servlet:
    context-path: /traceability-api

spring:
  application:
    name: traceability-microservice
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27018/traceability_db}
    database: ${SPRING_MONGODB_DATABASE:traceability_db}
    auto-index-creation: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:mySuperSecureSecretKeyForPragmaPowerUpProject2025}
